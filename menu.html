<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地獄茶記 · 常餐牌 / Set Menu</title>
<style>
:root{--ink:#21483c;--paper:#fff8e6;--red:#963c2f;--line:#baae8a;color:var(--ink);background:#ece5d1;font-family:"Microsoft JhengHei","PingFang HK",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:20px clamp(16px,4vw,58px) 56px}
nav,.title,.subhead,.card-head,.asset-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
nav{padding:8px 0 16px;border-bottom:4px double var(--ink);flex-wrap:wrap}a{color:inherit;text-underline-offset:4px}nav strong{letter-spacing:.18em}nav div{display:flex;gap:16px;flex-wrap:wrap}nav a,.asset-foot a{font-size:.88rem;font-weight:650}
h1,h2,h3,p{margin:0}.title{margin:30px 0 20px;align-items:baseline;justify-content:start;flex-wrap:wrap}h1{font-size:clamp(42px,6.4vw,84px);line-height:1;letter-spacing:-.06em}.en{font-family:Georgia,serif}.title .en{font-style:italic;font-size:clamp(24px,3.4vw,46px)}
.service{padding:12px 16px;background:var(--ink);color:var(--paper);line-height:1.55;margin-bottom:20px}.service span,.caption{display:block;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--paper);border:1px solid var(--ink);padding:clamp(16px,2vw,27px)}.card-head{justify-content:start;align-items:center}.letter{background:var(--ink);color:var(--paper);padding:.08em .27em;font:700 48px/1.15 Georgia,serif}h2{font-size:clamp(21px,2vw,30px);line-height:1.2}.card-head .en{margin:.3em 0;font-size:1rem}.recipe{border-block:1px dashed var(--line);padding:10px 0;margin:15px 0;font-size:.94rem}
.choose{display:flex;gap:8px 15px;flex-wrap:wrap}.choose label{font-size:.78rem;color:var(--red);font-weight:700}.choose select{display:block;margin-top:4px;background:white;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid #829386;max-width:100%}
.ticket{margin:16px 0 0;border-left:3px solid var(--red);padding-left:10px}.ticket small{display:block;line-height:1.4;margin-top:4px}
.subhead{border-top:4px double var(--ink);margin:32px 0 12px;padding-top:16px;align-items:baseline;flex-wrap:wrap}.subhead h2 span{font:italic 1.3rem Georgia,serif}.caption{color:#4f6557}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.asset{margin:0;border:1px solid var(--line);background:var(--paper)}.asset img{display:block;width:100%;height:clamp(120px,14vw,180px);object-fit:contain;background:#e5ebda}.asset-foot{padding:12px;align-items:start;flex-wrap:wrap}.asset-foot small{display:block;font-family:Georgia,serif}.asset-foot a{color:var(--red)}.note{border-top:1px dashed var(--line);padding:8px 12px;font-size:.83rem;line-height:1.45}
@media(max-width:740px){.grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}nav div{gap:10px}.subhead{gap:6px}}@media(max-width:400px){.asset-foot{display:grid}}
</style>
</head>
<body><main>
<nav><strong>地獄茶記</strong><div><a href="#textures">道具貼圖 / Textures ↓</a><a href="index.html">投影遊戲 / Game ↗</a></div></nav>
<header class="title"><h1>常餐牌</h1><span class="en" lang="en">Set Menu</span></header>
<p class="service"><strong>每枱先上水，再上餸。A、B、C 餐最後上飲品；D 餐上餸即齊。</strong><span lang="en">Serve water at every table first, then food. Finish sets A–C with the ordered drink. Set D is complete after the food.</span></p>
<section class="grid" aria-label="套餐 / Set meals"></section>
<section id="textures"><header class="subhead"><h2>道具貼圖 <span lang="en">Kitchen textures</span></h2><p class="caption">透明 PNG · 768 × 768 px</p></header><div class="gallery"></div></section>
</main>
<template id="set-card"><article class="card"><header class="card-head"><b class="letter"></b><div><h2></h2><p class="en" lang="en"></p></div></header>
<p class="recipe"></p><div class="choose"><label>改配 / Request<select class="modifier"></select></label><label>飲品 / Drink<select class="drink"></select></label></div>
<div class="ticket" aria-live="polite"><strong></strong><small lang="en"></small><small class="quantities"></small></div></article></template>
<script src="menu-data.js"></script>
<script>
const {stock,sets,drinks,orders,modifiers,options}=TeaMenu;
const drinkLabels={milkTea:'奶茶',coffee:'咖啡',lemonTea:'檸檬茶',water:'清水'};
function portions(order){
  const items=[];
  if(order.ingredients.macaroni) items.push('熟通粉 / Cooked macaroni ×1');
  if(order.ingredients.rice) items.push('白飯 / Cooked rice ×1');
  items.push('火腿 / Ham ×'+order.ingredients.ham);
  if(order.eggStyle) items.push(order.eggStyle==='boiled'?'烚蛋 / Boiled egg ×1':'炒蛋 / Scrambled egg ×1');
  return items.join(' · ');
}
for(const set of sets){
  const card=document.querySelector('#set-card').content.firstElementChild.cloneNode(true);
  card.querySelector('.letter').textContent=set.code;
  card.querySelector('h2').textContent=set.zh;
  card.querySelector('.en').textContent=set.en;
  const variants=orders.filter(o=>o.setCode===set.code);
  card.querySelector('.recipe').textContent=portions(variants[0])+(set.drink?' · 配飲品 / Choice of drink':'');
  const modifier=card.querySelector('.modifier'),drink=card.querySelector('.drink');
  for(const id of options(set)) modifier.add(new Option(modifiers[id].join(' / '),id));
  if(set.drink){
    for(const [id,names] of Object.entries(drinks)) drink.add(new Option(drinkLabels[id]+' / '+names[1],id));
  }else{drink.parentElement.remove()}
  function update(){
    const order=variants.find(o=>o.modifier===modifier.value && o.drink===(set.drink?drink.value:null));
    card.querySelector('.ticket strong').textContent=order.text;
    card.querySelector('.ticket [lang=en]').textContent=order.english;
    card.querySelector('.quantities').textContent=portions(order);
  }
  modifier.onchange=drink.onchange=update;
  update();
  document.querySelector('.grid').append(card);
}
const textures=[
  ...Object.entries(stock).map(([key,names])=>({key,names})),
  {key:'pot',names:['煮鍋','Boiling pot'],note:'×2 · 烚通粉、煮飯、烚蛋 / Boil macaroni, rice or eggs.'},
  {key:'wok',names:['炒鑊','Wok'],note:'×1 · 用鑊鏟炒蛋 / Scramble eggs with the spatula.'}
];
for(const {key,names,note} of textures){
  const fig=document.createElement('figure');
  fig.className='asset';
  const url='assets/'+key+'.png';
  fig.innerHTML='<img width="768" height="768"><figcaption class="asset-foot"><div><b></b><small lang="en"></small></div><a>↓ 下載 / Save PNG</a></figcaption>';
  const img=fig.querySelector('img'),link=fig.querySelector('a');
  img.src=url;img.alt=names.join(' / ');
  fig.querySelector('b').textContent=names[0];fig.querySelector('small').textContent=names[1];
  link.href=url;link.download=key+'.png';link.setAttribute('aria-label',names.join(' / ')+' — 下載 / Save PNG');
  if(note){const p=document.createElement('p');p.className='note';p.textContent=note;fig.append(p)}
  document.querySelector('.gallery').append(fig);
}
</script></body></html>
