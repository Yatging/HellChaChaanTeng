<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地獄茶記 · 常餐牌 / Set Menu</title>
<style>
:root{--jade:#173f35;--paper:#fff6df;--red:#9c392c;color:var(--jade);font-family:"Microsoft JhengHei","PingFang HK",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#e8e1cf}main{max-width:1180px;margin:auto;padding:24px clamp(16px,4vw,54px) 44px}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:3px double var(--jade);padding:0 0 12px}.brand{font-weight:900;letter-spacing:.16em}.mast a{color:var(--jade);text-underline-offset:4px}header{margin:24px 0;display:flex;align-items:baseline;gap:18px}h1{font:900 clamp(36px,6vw,74px)/1.1 Georgia,serif;margin:0}.en-title{font:italic clamp(20px,3vw,38px) Georgia,serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--paper);border:1px solid var(--jade);padding:20px;box-shadow:3px 3px 0 #173f352b}.head{display:grid;grid-template-columns:auto 1fr 78px;gap:14px;align-items:center}.letter{font:800 40px/1 Georgia,serif;color:var(--paper);padding:6px 13px;background:var(--jade)}h2,h3,p{margin:0}.head h2{font-size:clamp(22px,3vw,32px)}.head p{font-family:Georgia,serif;font-size:17px}.dish{width:78px;height:65px}.recipe{margin:14px 0;padding:10px 0;border-block:1px dashed #a3a185;line-height:1.6}.label{font-size:.85rem;color:var(--red);font-weight:700}.options{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}button{cursor:pointer;background:transparent;border:1px solid #8b998a;color:var(--jade);padding:6px 9px;font:inherit;font-size:.83rem}button[aria-pressed=true]{background:var(--jade);color:white}.ticket{margin-top:12px;border-left:3px solid var(--red);padding-left:10px;line-height:1.4}.ticket small{display:block;margin-top:3px}.stock{margin-top:24px;padding:18px;background:var(--jade);color:var(--paper)}.stock h3{font-size:16px}.stock p{margin-top:8px;line-height:1.5}.fine{font-size:.86rem}.symbols{position:absolute;width:0;height:0;overflow:hidden}
@media(max-width:740px){.grid{grid-template-columns:1fr}.head{grid-template-columns:auto 1fr 60px}.dish{width:60px}.mast{font-size:14px}header{margin:18px 0}}
</style></head><body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="sandwich" viewBox="0 0 90 62"><g stroke="#344738" stroke-width="2" stroke-linejoin="round"><path d="M5 43L56 14l28 23-49 22z" fill="#e5b574"/><path d="M7 37l49-27 26 22-48 23z" fill="#c87768"/><path d="M6 32L58 7l23 21-46 20z" fill="#f0c74c"/><path d="M5 27L54 3l28 20-49 22z" fill="#f8dfab"/></g></symbol>
<symbol id="bowl" viewBox="0 0 90 62"><g stroke="#344738" stroke-width="2"><path d="M5 25h80Q78 53 50 54l-1 4H34v-4Q13 49 5 25z" fill="#9bc2ac"/><ellipse cx="45" cy="24" rx="39" ry="13" fill="#e8c28b"/><path d="M14 21l21-6 8 6-22 7z" fill="#cc8276"/><ellipse cx="57" cy="22" rx="16" ry="9" fill="#fff0cb"/><circle cx="57" cy="22" r="5" fill="#eeb740"/></g></symbol>
</defs></svg>
<main><div class="mast"><span class="brand">地獄茶記</span><a href="index.html">投影遊戲 / Game ↗</a></div>
<header><h1>常餐牌</h1><span class="en-title" lang="en">Set Menu</span></header><section class="grid" aria-label="套餐 Set meals"></section>
<section class="stock"><h3>備料台 / Prep counter</h3><p id="inventory"></p><p class="fine">一格代表一份。方包一份為兩片，通粉一份為一勺。湯底預先備好。<br>One token per portion. One bread token is two slices. One macaroni token is a scoop. Broth is prepared in advance.</p></section></main>
<script src="menu-data.js"></script><script>
const {stock,sets,orders}=TeaMenu;
const portionList=recipe=>Object.entries(recipe).filter(([,qty])=>qty>0).map(([id,qty])=>stock[id].join(' / ')+' ×'+qty).join(' · ');
document.querySelector('#inventory').textContent=Object.values(stock).map(names=>names.join(' / ')).join('　·　');
for(const set of sets){
  const card=document.createElement('article');
  card.className='card';
  card.innerHTML='<div class="head"><b class="letter"></b><div><h2></h2><p lang="en"></p></div><svg class="dish" aria-hidden="true"><use href="#'+(set.base==='bread'?'sandwich':'bowl')+'"/></svg></div><div class="recipe"><span class="label">標準配料 / Base recipe</span><p></p></div><div class="label">客人要求 / Guest request</div><div class="options"></div><div class="ticket" aria-live="polite"><strong></strong><small lang="en"></small><small class="quantities"></small></div>';
  card.querySelector('.letter').textContent=set.code;card.querySelector('h2').textContent=set.zh;card.querySelector('.head p').textContent=set.en;
  card.querySelector('.recipe p').textContent=portionList({[set.base]:1,[set.filling]:1,egg:1});
  const options=card.querySelector('.options');
  for(const order of orders.filter(order=>order.setCode===set.code)){
    const button=document.createElement('button');
    button.textContent=order.requestZh+' / '+order.requestEn;
    button.onclick=()=>{
      for(const other of options.children)other.setAttribute('aria-pressed',String(other===button));
      card.querySelector('.ticket strong').textContent=order.text;
      card.querySelector('.ticket [lang=en]').textContent=order.english;
      card.querySelector('.quantities').textContent=portionList(order.ingredients);
    };
    button.setAttribute('aria-pressed','false');options.append(button);
  }
  options.firstChild.click();document.querySelector('.grid').append(card);
}
</script></body></html>
